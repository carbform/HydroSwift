[tool.setuptools]
packages = [
    "hydroswift",
    "hydroswift.core",
    "hydroswift.sources",
    "hydroswift.sources.nwdp",
    "hydroswift.sources.cwc_ffs",
    "hydroswift.sources.cwc_rsms",
    "hydroswift.sources.wris_api",
    "hydroswift.experimental",
    "hydroswift.gui",
    "swift_app",
    "swift_app.experimental",
    "swift_app.gui",
]

[tool.setuptools.package-data]
hydroswift = ["*.csv"]
"hydroswift.sources.cwc_ffs" = ["*.csv"]
swift_app = ["*.csv"]

[project]
name = "hydroswift"
version = "1.0.0"
description = "Fast, unified workflows for hydrological data."
authors = [{name="Carbform"}]
requires-python = ">=3.9"
keywords = ["hydrology", "water-resources", "data", "basin", "india"]

dependencies = [
    "requests",
    "pandas",
    "tqdm",
    "openpyxl",
    "matplotlib",
    "cryptography"
]

[project.urls]
Homepage = "https://github.com/carbform/HydroSwift"
Documentation = "https://hydroswift.readthedocs.io"

[project.optional-dependencies]
geo = ["geopandas", "shapely"]
rich = ["rich"]
gui = ["PyQt5>=5.15.0", "PyQt5-stubs"]
all = ["geopandas", "shapely", "rich", "PyQt5>=5.15.0", "PyQt5-stubs"]

[project.scripts]
hyswift = "hydroswift.main:main"
hyswift-gui = "hydroswift.gui.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning"
]
